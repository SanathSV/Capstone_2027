[project]
name = "astra-bot"
version = "0.1.0"
description = "Astra bot engine — headless Chromium agent that joins Google Meet"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.47",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
