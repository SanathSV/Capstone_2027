[package]
name = "cdi-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.33"
egui_plot = "0.33"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
dirs = "5.0"
