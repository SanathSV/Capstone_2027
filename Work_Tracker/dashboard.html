<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Focus Tracker Dashboard</title>
  <style>
    :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#17212b;background:#f4f1ea}*{box-sizing:border-box}
    body{margin:0}.wrap{max-width:1120px;margin:auto;padding:36px 22px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #17212b;padding-bottom:22px;margin-bottom:24px}h1{font-size:clamp(2rem,5vw,4.5rem);line-height:.9;margin:0;letter-spacing:-.06em}.eyebrow{color:#c4542d;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;margin-bottom:10px}.stamp{font-size:.8rem;color:#65717a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}.stat,.panel{background:#fff;border:1px solid #d9d5cb;padding:18px;border-radius:6px}.stat strong{display:block;font-size:2rem;color:#c4542d}.stat span{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.panel h2{font-size:1.1rem;margin:0 0 18px}.report{border-top:1px solid #e4e0d8;padding:14px 0}.report:first-of-type{border-top:0}.report-top{display:flex;justify-content:space-between;gap:12px}.muted{color:#65717a;font-size:.85rem}.bar{height:10px;background:#e8e4db;margin-top:10px;overflow:hidden;border-radius:99px}.fill{height:100%;background:#c4542d;animation:grow .8s ease-out}@keyframes grow{from{width:0}}.error{color:#a52d25}
    @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.head{display:block}.stamp{margin-top:16px}}
  </style>
</head>
<body><main class="wrap"><header class="head"><div><div class="eyebrow">Offline-to-online telemetry</div><h1>Work rhythm,<br>made visible.</h1></div><div id="updated" class="stamp">Loading reports...</div></header>
<section class="stats"><div class="stat"><strong id="hours">0</strong><span>Active hours</span></div><div class="stat"><strong id="idle">0</strong><span>Idle hours</span></div><div class="stat"><strong id="commits">0</strong><span>Verified commits</span></div><div class="stat"><strong id="ratio">0%</strong><span>Active ratio</span></div></section>
<div class="grid"><section class="panel"><h2>Employee submissions</h2><div id="reports"><span class="muted">Fetching sanitized daily reports...</span></div></section><section class="panel"><h2>Project completion</h2><div id="projects"><span class="muted">No project data yet.</span></div></section></div></main>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const response=await fetch('/api/reports');if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();const reports=data.reports||[],projects=data.projects||[];let active=0,idle=0,commits=0;reports.forEach(r=>{active+=Number(r.active_man_hours)||0;idle+=Number(r.idle_hours)||0;commits+=Number(r.commit_count)||0});document.querySelector('#hours').textContent=active.toFixed(2);document.querySelector('#idle').textContent=idle.toFixed(2);document.querySelector('#commits').textContent=commits;document.querySelector('#ratio').textContent=(active+idle?Math.round(active/(active+idle)*100):0)+'%';document.querySelector('#updated').textContent='Updated '+new Date().toLocaleTimeString();document.querySelector('#reports').innerHTML=reports.length?reports.map(r=>`<article class="report"><div class="report-top"><strong>${esc(r.employee_id)} · ${esc(r.project_id)}</strong><span class="muted">${Number(r.active_man_hours).toFixed(2)} active h</span></div><div class="muted">${esc(r.task)} · ${r.commit_count} commit(s) · +${r.additions}/-${r.deletions}</div></article>`).join(''):'<span class="muted">No submissions yet.</span>';document.querySelector('#projects').innerHTML=projects.length?projects.map(p=>`<article class="report"><div class="report-top"><strong>${esc(p.project_id)}</strong><span>${p.completion_percent}%</span></div><div class="bar"><div class="fill" style="width:${p.completion_percent}%"></div></div><div class="muted">${p.commits} commit(s), ${Number(p.active_hours).toFixed(2)} active h</div></article>`).join(''):'<span class="muted">No project data yet.</span>'}catch(error){document.querySelector('#reports').innerHTML='<span class="error">Dashboard unavailable: '+esc(error.message)+'</span>'}}
load();setInterval(load,30000);
</script></body></html>
