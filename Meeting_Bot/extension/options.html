<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meet Notetaker Bot — Options</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
         max-width: 520px; margin: 40px auto; padding: 0 20px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  label { flex: 0 0 110px; color: #666; }
  input { flex: 1; padding: 7px 9px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #1a73e8;
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #saved { color: #188038; margin-left: 10px; }
  p.help { color: #666; font-size: 13px; }
</style>
</head>
<body>
  <h1>Meet Notetaker Bot</h1>
  <p class="help">
    Where your bot container is reachable. The API key is only needed if the
    server was started with <code>MEET_API_KEY</code> set.
  </p>
  <div class="row">
    <label for="server">Server URL</label>
    <input id="server" placeholder="http://localhost:8080">
  </div>
  <div class="row">
    <label for="key">API key</label>
    <input id="key" type="password" placeholder="optional">
  </div>
  <div class="row">
    <label for="name">Bot name</label>
    <input id="name" placeholder="Meeting Notetaker">
  </div>
  <button id="save">Save</button><span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
