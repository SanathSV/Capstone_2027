services:
  meet-listener:
    build: .
    image: meet-listener:latest
    container_name: meet-listener
    ports:
      - "8080:8080"
    volumes:
      # The Google session produced by `python meet_listener.py --login`.
      # Read-write: Chrome needs to update its own profile as it runs.
      - ./creds:/creds
      # Transcripts survive container restarts.
      - ./data:/data
    environment:
      MEET_PROFILE_DIR: /creds
      MEET_DATA_DIR: /data
      # Set a key to require X-API-Key on every call. Leave empty only on a
      # private network -- an open server will join meetings for anyone.
      MEET_API_KEY: "${MEET_API_KEY:-}"
      # 1 session per container is the simple, reliable default; scale out with
      # more replicas rather than up. Above 1, each session gets a profile copy.
      MEET_MAX_SESSIONS: "${MEET_MAX_SESSIONS:-1}"
      MEET_HEADLESS: "0"
      # Real Chrome: Meet degrades its features for unrecognised browsers.
      MEET_CHANNEL: "chrome"
      MEET_CORS_ORIGIN: "*"
      # Spoken language for Meet to transcribe, e.g. Telugu, Hindi, Spanish.
      # Empty means the account default. Meet does NOT auto-detect.
      MEET_CAPTION_LANGUAGE: "${MEET_CAPTION_LANGUAGE:-}"
      # Wake-word assistant: say "Astra" or "yo bot" in the meeting and the bot
      # answers in the chat using your local Ollama. Ollama runs on the HOST,
      # so the container reaches it through host.docker.internal.
      MEET_ASSISTANT: "${MEET_ASSISTANT:-1}"
      MEET_WAKE_WORDS: "${MEET_WAKE_WORDS:-astra,yo bot}"
      MEET_OLLAMA_URL: "${MEET_OLLAMA_URL:-http://host.docker.internal:11434}"
      MEET_OLLAMA_MODEL: "${MEET_OLLAMA_MODEL:-llama3.2}"
      # Screenshots on failure, written into the mounted data volume.
      MEET_DEBUG_DIR: "/data/debug"
      # Join as the mounted Google account and nothing else. Set to "0" only if
      # you genuinely want anonymous guest joins, which need manual admission.
      MEET_REQUIRE_LOGIN: "${MEET_REQUIRE_LOGIN:-1}"
      # Where to PUSH transcripts. This is host_listener.py running on your
      # machine -- the container reaches it through host.docker.internal.
      # Set to "" to disable pushing and poll the API instead.
      MEET_CALLBACK_URL: "${MEET_CALLBACK_URL:-http://host.docker.internal:9000/ingest}"
      MEET_CALLBACK_KEY: "${MEET_CALLBACK_KEY:-}"
      MEET_CALLBACK_BATCH_SECONDS: "1.0"
    # Docker Desktop resolves host.docker.internal already; this line is what
    # makes the same name work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chromium needs more than Docker's default 64MB of shared memory.
    shm_size: "2gb"
    restart: unless-stopped
